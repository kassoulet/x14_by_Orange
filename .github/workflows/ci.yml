name: CI
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the JS modules
        run: |
          find web -name '*.js' -not -path 'web/vendor/*' | while read f; do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "FAIL $f"; exit 1; }
          done
