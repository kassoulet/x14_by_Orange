<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X14 - JS port</title>
<style>
:root{--bg:#0b0b10;--fg:#d8d8e0;--ac:#ff8a3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:18px;margin:14px 0 2px;letter-spacing:2px}small{opacity:.7}
#stage{position:relative;background:#000;border:1px solid #333;margin-top:8px;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;color:#fff;font-size:20px;cursor:pointer;text-align:center}
#bar{display:flex;gap:8px;align-items:center;width:min(96vw,900px);margin:10px 0}
button{background:#1d1d28;color:var(--fg);border:1px solid #444;border-radius:4px;padding:6px 12px;cursor:pointer}button:hover,button.on{border-color:var(--ac)}
input[type=range]{flex:1;accent-color:var(--ac)}#tm{font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
#fxl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:900px;margin:0 12px 12px}
p.k{max-width:900px;opacity:.75;text-align:center;margin:0 12px 16px}
</style></head><body>
<h1>X14</h1><small>Orange 1995 - JavaScript port (shown 4:3)</small>
<div id="stage"><canvas id="c" width="320" height="200"></canvas><div id="go">Loading...</div></div>
<div id="bar"><button id="pp" title="Space">Play</button><button id="b10">-10s</button><input id="seek" type="range" min="0" max="2510" step="1" value="0"><button id="f10">+10s</button><span id="tm">0:00 / 4:11</span><button id="fs" title="F">Fullscreen</button></div>
<div id="fxl"></div>
<p class="k">Space = play/pause - Left/Right = -/+5 s (Shift 10) - Up/Down = previous/next effect - F = fullscreen - M = mute</p>
<script type="module" src="player.js"></script></body></html>
